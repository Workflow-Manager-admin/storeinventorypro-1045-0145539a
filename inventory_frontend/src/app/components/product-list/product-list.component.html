<div class="list-bar">
  <div>
    <input
      class="search-input"
      type="search"
      placeholder="Search products..."
      [(ngModel)]="search"
      (input)="onSearchChange()"
    />
    <input
      class="stock-input"
      type="number"
      min="0"
      placeholder="Min Stock"
      [(ngModel)]="minStock"
      (input)="onSearchChange()"
    />
  </div>
  <button class="add-btn" (click)="goToAdd()">+ Add Product</button>
</div>

<div *ngIf="loading" class="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>
<table class="product-table" *ngIf="!loading && !error">
  <thead>
    <tr>
      <th>Name</th>
      <th>Stock</th>
      <th>Category</th>
      <th>Price</th>
      <th>Last Updated</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let p of products" (click)="goToDetail(p)" class="product-row">
      <td>{{ p.name }}</td>
      <td [ngClass]="{'low-stock': p.stock_level <= 2}">{{ p.stock_level }}</td>
      <td>{{ p.category || '-' }}</td>
      <td>{{ p.price | currency:'USD' }}</td>
      <td>{{ p.updated_at | date:'short' }}</td>
    </tr>
  </tbody>
</table>
